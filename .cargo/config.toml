[build]
# x86-64-v3 covers AVX2/BMI2/FMA — every CPU since ~2015.
# For deploy box == build box, override with RUSTFLAGS='-C target-cpu=native'.
rustflags = [
  "-C", "target-cpu=x86-64-v3",
  "-C", "target-feature=+avx2,+bmi2,+fma,+sse4.2",
  "-C", "codegen-units=1",
  "-C", "lto=fat",
  "-C", "panic=abort",
  "-C", "strip=symbols",
  "-C", "force-frame-pointers=no",
  "-Z", "merge-functions=aggressive",
  "-Z", "trap-unreachable=no",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "target-cpu=x86-64-v3",
  "-C", "target-feature=+avx2,+bmi2,+fma,+sse4.2",
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,-z,norelro",
  "-C", "link-arg=-Wl,--build-id=none",
]