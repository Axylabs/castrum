name: Build native addons

# Reusable multi-platform addon build. Called by:
#   - ci.yml   (PR/push validation; artifacts are kept for debugging)
#   - release.yml (tag-triggered publish; artifacts feed the npm tarball)
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Native addon binary name (kept in sync with package.json "napi.binaryName").
  BINARY_NAME: castrum

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: "true"
    strategy:
      fail-fast: false
      matrix:
        # `build` is the exact napi command; `apt` an optional extra cross C
        # toolchain. NOTE: do NOT use `--use-napi-cross` for the linux gnu
        # targets — its prebuilt toolchain is gcc 4.8.5 / glibc 2.17, which
        # cannot compile aws-lc-sys (needs C11 stdatomic.h and modern -march
        # values) nor libmimalloc-sys (-Wdate-time), and its ancient linker
        # leaves the host-compiled C objects' __isoc23_* symbols unresolved.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build: bun run build --target x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build: bun run build --target x86_64-unknown-linux-musl -x
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            build: bun run build --target aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build: bun run build --target aarch64-unknown-linux-musl -x
          - target: x86_64-apple-darwin
            os: macos-latest
            build: bun run build --target x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            build: bun run build --target aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build: bun run build --target x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # dtolnay/rust-toolchain encodes the toolchain in the REF (`@stable`,
      # `@nightly`, `@1.98.0`), so a SHA-pinned ref MUST pass it explicitly.
      # It must be the channel rust-toolchain.toml names, because cargo resolves
      # THAT toolchain inside the repo: installing `stable` (+ its targets)
      # leaves every cross target with no std, i.e. "can't find crate for core".
      - name: Read the pinned Rust channel (rust-toolchain.toml)
        id: rust-channel
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          targets: ${{ matrix.target }}
      - uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Extra cross C toolchain for the linux gnu aarch64 entry (the runner's
      # host gcc only targets x86_64).
      - name: Install cross C toolchain
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      # cargo-zigbuild (the `-x` flag) needs zig on PATH plus the subcommand.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        if: ${{ contains(matrix.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bun install --frozen-lockfile
      - name: Build release addon
        run: ${{ matrix.build }}
        shell: bash
        env:
          # Only the aarch64-unknown-linux-gnu entry uses these; both the `cc`
          # crate and aws-lc-sys's CMake pick their compiler up from here.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      # Dual-binary CPU-detect: the x86-64-gnu target also ships the x86-64-v3
      # (AVX2/BMI2/FMA/SSE4.2) SIMD variant. The loader picks it at runtime when
      # the host CPU supports v3; the `castrum.*.node` glob below uploads both.
      - name: Build x86-64-v3 SIMD variant (linux-x64-gnu only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash scripts/build-v3.sh
      - name: Upload addon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: addon-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}.*.node
          if-no-files-found: error
