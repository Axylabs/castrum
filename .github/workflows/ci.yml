name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Nightly full pipeline: the CPU bench + proven perf gate runs against a
  # quiet baseline, so slow regressions that a single PR run can mask are
  # still caught. Also enables manual dispatch from the Actions tab.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Native addon binary name (kept in sync with package.json "napi.binaryName").
  BINARY_NAME: castrum

jobs:
  # ── Rust correctness & lint ──────────────────────────────────────
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      # Release profile (`panic=unwind`, `overflow-checks=true`) is never hit by
      # the debug `cargo test` above — run the suite once in release so panic/
      # overflow behavior under the shipped profile is covered too.
      - name: Unit tests (release profile)
        run: cargo test --release
      - name: Dependency audit
        uses: EmbarkStudios/cargo-deny-action@v2

  # ── Software supply-chain scanning (OSV) ─────────────────────────
  # Scans the JS + Rust lockfiles against the OSV vulnerability database
  # (complements cargo-deny advisories + `bun audit`). Reports findings as a
  # SARIF upload for the GitHub Security tab.
  security:
    name: Supply-chain scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            .

  # ── TypeScript correctness ───────────────────────────────────────
  typescript:
    name: TS (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Bun-version matrix: catches runtime regressions across supported Bun
        # releases. `1.4.0` matches the local dev toolchain; `latest` tracks the
        # current release channel.
        bun: ['1.4.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Build native addon (host)
        run: bun run build:debug
      - name: Unit tests
        run: bun test
      # Coverage floor (scripts/check-coverage.mjs): fails if overall line
      # coverage drops below the configured minimum. Safety net, not a target.
      - name: Coverage floor
        run: bun run test:coverage
      - name: Typecheck
        run: bunx --bun tsc --noEmit
      # Typecheck test/ + bench/ too (unused locals/params on) so test-only
      # type regressions and dead test code are caught in CI.
      - name: Typecheck (test/ + bench/)
        run: bunx --bun tsc --noEmit -p tsconfig.test.json
      # Lint-rule gate only (format/assist disabled): the repo intentionally
      # does not churn the whole tree's formatting (see repo docs), so CI
      # blocks new lint warnings/errors without requiring a format sweep.
      - name: Lint (Biome, rules only)
        run: bun run lint:ci
      - name: Correctness checks (native vs baseline)
        run: bun run check
      # Native-vs-JS selection completeness: `scripts/select-native.ts` OPS array
      # is the source of truth for what stays in src/selection.json — any op
      # with a baked decision MUST be in OPS (or skip+pinned) or --write would
      # drop it. Guards consumers silently binding JS instead of the addon.
      - name: Native-vs-JS selection drift
        run: bun run check:selection
      # Wire-format guard: the HTTP load generator validates the ingress
      # response SHAPE (ok===true + requestId, error.code/message) — this is
      # the only check that catches accidental wire-format breakage.
      - name: HTTP smoke (wire-format guard)
        run: bun run bench:http:smoke
        timeout-minutes: 8
      - name: Version consistency (package.json ↔ Cargo.toml)
        run: bun run check:version
      # Reports dependency advisories; blocks on high severity so a release
      # can't ship with a known critical advisory in the runtime tree.
      - name: JS dependency audit
        run: bun run audit --audit-level=high
        continue-on-error: false

  # ── Performance-proven surface ───────────────────────────────────
  # Guards `src/shared/proven.ts`: builds the RELEASE addon (the shipped CPU
  # baseline), runs the CPU benchmark, then audits the proven registry against
  # the report. Fails if a "proven" function regresses past the tolerance.
  proven:
    name: Proven surface audit
    runs-on: ubuntu-latest
    needs: [typescript]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Build release addon (baseline CPU)
        run: bun run build
      - name: CPU benchmark (writes bench/results/cpu/latest.json)
        run: bun run check
      - name: FFI symbol parity + transport self-test
        run: bun test test/unit/native/ffi-symbol-parity.test.ts test/unit/native/ffi.test.ts

  # ── Node.js compatibility ────────────────────────────────────────
  # Builds the compiled ESM entry (dist/) and runs the Node smoke suite on the
  # supported Node versions. Bun stays the primary target; this job guards the
  # Node.js backward-compat contract.
  node:
    name: Node ${{ matrix.node }} (dist + smoke)
    runs-on: ubuntu-latest
    needs: [typescript]
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Node 24 included: `node --test` rejects a directory argument on it
        # (test:node uses explicit file paths) — CI must catch such regressions.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Build native addon (host)
        run: bun run build:debug
      - name: Build compiled ESM entry (dist)
        run: bun run build:js
      - name: Node smoke + enterprise tests
        run: node --test test/integration/node-smoke.test.mjs test/integration/node-enterprise.test.mjs
      - name: Validate npm tarball (dist + native binaries)
        run: npm pack --dry-run 2>&1 | grep -E "dist/index|\.node" | head -20
      - name: Installed-tarball end-to-end (import from node_modules)
        run: node scripts/verify-install.mjs

  # ── Multi-platform addon artifacts ───────────────────────────────
  # Produces portable (baseline CPU) artifacts for every napi target.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [rust]
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: napi-rs/napi-rs-action@v2
        with:
          target: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - name: Build release addon
        run: bun run build
      # Dual-binary CPU-detect: the x86-64-gnu target also ships the x86-64-v3
      # (AVX2/BMI2/FMA/SSE4.2) SIMD variant. The loader picks it at runtime when
      # the host CPU supports v3; the `castrum.*.node` glob below uploads both.
      - name: Build x86-64-v3 SIMD variant (linux-x64-gnu only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash scripts/build-v3.sh
      - name: Upload addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}.*.node
          if-no-files-found: error

  # ── Publish to npm ─────────────────────────────────────────────
  # Runs only on version tags (v*). Downloads every platform addon from the
  # build job, then `npm publish` runs scripts/prepublish.mjs (prepublishOnly),
  # which stages ./artifacts/*.node into the package root and verifies that all
  # napi.targets are present before the tarball is created.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # A tag must not ship past typecheck, unit/smoke tests, the wire-format
    # guard, or the Node compat suite — require all quality gates.
    needs: [build, typescript, node]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: read
      # Needed for SLSA provenance attestation (actions/attest-build-provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Download all platform addons
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: addon-*
          merge-multiple: true
      - name: Generate SBOM (dependency inventory)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          artifact-name: castrum-sbom.spdx.json
      - name: Publish to npm
        run: npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # SLSA3 provenance: records the repo/commit that produced this release so
      # consumers can verify the artifact's supply chain.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '${{ github.workspace }}/artifacts/*.node'
