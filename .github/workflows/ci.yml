name: CI

on:
  # Version tags are owned by release.yml (build + npm publish + GitHub
  # release); CI only validates branches and pull requests.
  push:
    branches: [main]
  pull_request:
  # Nightly full pipeline: the CPU bench + proven perf gate runs against a
  # quiet baseline, so slow regressions that a single PR run can mask are
  # still caught. Also enables manual dispatch from the Actions tab.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Native addon binary name (kept in sync with package.json "napi.binaryName").
  BINARY_NAME: castrum

jobs:
  # ── Rust correctness & lint ──────────────────────────────────────
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # sccache: compiled objects are shared across jobs and survive between
      # runs through the GitHub Actions cache backend (the ephemeral runner's
      # target/ dies with the job — this is what makes the cross-job + cross-
      # profile object reuse possible).
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # NOTE: dtolnay/rust-toolchain encodes the toolchain in the REF (`@stable`,
      # `@nightly`, `@1.98.0`), so a SHA-pinned ref MUST pass it explicitly —
      # otherwise the action fails with "'toolchain' is a required input". The
      # exact compiler the build uses still comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test
      # Release profile (`panic=unwind`, `overflow-checks=true`) is never hit by
      # the debug `cargo test` above — run the suite once in release so panic/
      # overflow behavior under the shipped profile is covered too. Gated to the
      # nightly schedule only: the debug suite above covers PR-time
      # correctness, and the release pass costs a full codegen+LINK (sccache
      # only caches the per-object compile, not the final link), so running it
      # on every PR would add ~1-2 min to every commit. Nightly catches any
      # release-only regression within a day.
      - name: Unit tests (release profile)
        if: ${{ github.event_name == 'schedule' }}
        run: cargo test --release
      - name: Dependency audit
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        # This action runs `cargo` inside its own container, which does NOT have
        # `sccache` on PATH. The job-level `RUSTC_WRAPPER=sccache` (needed by the
        # host compile steps) would otherwise leak in and every cargo invocation
        # would fail with "could not execute process `sccache ...`". Clear it here.
        env:
          RUSTC_WRAPPER: ""

  # ── Software supply-chain scanning (OSV) ─────────────────────────
  # Scans the JS + Rust lockfiles against the OSV vulnerability database
  # (complements cargo-deny advisories + `bun audit`). Reports findings as a
  # SARIF upload for the GitHub Security tab.
  # NOTE: v2 of `google/osv-scanner-action` restructured the repository — the
  # root `action.yml` is a metadata-only stub with no `runs:` section, so
  # referencing `google/osv-scanner-action@<sha>` as a STEP fails with
  # "Top level 'runs:' section is required". Upstream's supported entry point is
  # the reusable workflow below, called at JOB level (so no `runs-on`/`steps`).
  security:
    name: Supply-chain scan (OSV)
    permissions:
      # Required by the reusable workflow to upload its SARIF report.
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        -r
        ./

  # ── TypeScript correctness ───────────────────────────────────────
  typescript:
    name: TS (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: "true"
    strategy:
      fail-fast: false
      matrix:
        # Bun-version matrix: catches runtime regressions across supported Bun
        # releases. `1.4.2` is the oldest tested release; `latest` tracks the
        # current channel (1.4.4 at the time of writing).
        bun: ['1.4.2', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bun install --frozen-lockfile
      - name: Build native addon (host)
        run: bun run build:debug
      - name: Unit tests
        run: bun run test
      # Coverage floor (scripts/check-coverage.mjs): fails if overall line
      # coverage drops below the configured minimum. Safety net, not a target.
      - name: Coverage floor
        run: bun run test:coverage
      - name: Typecheck
        run: bunx --bun tsc --noEmit
      # Typecheck test/ + bench/ too (unused locals/params on) so test-only
      # type regressions and dead test code are caught in CI.
      - name: Typecheck (test/ + bench/)
        run: bunx --bun tsc --noEmit -p tsconfig.test.json
      # Lint-rule gate only (format/assist disabled): the repo intentionally
      # does not churn the whole tree's formatting (see repo docs), so CI
      # blocks new lint warnings/errors without requiring a format sweep.
      - name: Lint (Biome, rules only)
        run: bun run lint:ci
      # Convention guards documented as CI-enforced in RULES.md: module headers,
      # runtime seam (`typeof Bun` only in detect.ts), the PURE-module purity
      # boundary, the FFI doc-count, and dangling doc links (check:clean), plus
      # the JSDoc coverage floor (check:jsdoc). These were missing from CI, so a
      # structural/JSDoc regression could merge unnoticed.
      - name: Conventions (check:clean + check:jsdoc)
        run: bun run check:clean && bun run check:jsdoc
      - name: Correctness checks (native vs baseline)
        run: bun run check
      # Native-vs-JS selection completeness: `scripts/select-native.ts` OPS array
      # is the source of truth for what stays in src/selection.json — any op
      # with a baked decision MUST be in OPS (or skip+pinned) or --write would
      # drop it. Guards consumers silently binding JS instead of the addon.
      #
      # ADVISORY: the drift comparison is a LIVE micro-benchmark of the addon
      # against JS baselines, judged against the ratios recorded by whichever
      # machine last ran `--write`, and this job builds a DEBUG addon — so the
      # numbers are only meaningful on a quiet machine with a release build.
      # The BLOCKING wiring contract is `test/unit/contract/proven.test.ts`
      # (executed by `bun test` above), which pins opImpl/builtins against the
      # committed selection. Refresh the recorded ratios deliberately with
      # `bun scripts/select-native.ts --write` + `bun run build` on a quiet,
      # baseline-CPU machine (it reports a stale `hmacSha256` entry today).
      - name: Native-vs-JS selection drift (advisory)
        run: bun run check:selection
        continue-on-error: true
      # Wire-format guard: the HTTP load generator validates the ingress
      # response SHAPE (ok===true + requestId, error.code/message) — this is
      # the only check that catches accidental wire-format breakage.
      - name: HTTP smoke (wire-format guard)
        run: bun run bench:http:smoke
        timeout-minutes: 8
      - name: Version consistency (package.json ↔ Cargo.toml)
        run: bun run check:version
      # Reports dependency advisories; blocks on high severity so a release
      # can't ship with a known critical advisory in the runtime tree.
      - name: JS dependency audit
        run: bun run audit --audit-level=high
        continue-on-error: false

  # ── Performance-proven surface ───────────────────────────────────
  # Guards `src/shared/proven.ts`: builds the RELEASE addon (the shipped CPU
  # baseline), runs the CPU benchmark, then audits the proven registry against
  # the report. Fails if a "proven" function regresses past the tolerance.
  proven:
    name: Proven surface audit
    runs-on: ubuntu-latest
    needs: [typescript]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bun install --frozen-lockfile
      - name: Build release addon (baseline CPU)
        run: bun run build
      - name: CPU benchmark (writes bench/results/cpu/latest.json)
        run: bun run check
      - name: FFI symbol parity + transport self-test
        run: bun test test/unit/native/ffi-symbol-parity.test.ts test/unit/native/ffi.test.ts

  # ── Node.js compatibility ────────────────────────────────────────
  # Builds the compiled ESM entry (dist/) and runs the Node smoke suite on the
  # supported Node versions. Bun stays the primary target; this job guards the
  # Node.js backward-compat contract.
  node:
    name: Node ${{ matrix.node }} (dist + smoke)
    runs-on: ubuntu-latest
    needs: [typescript]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: "true"
    strategy:
      fail-fast: false
      matrix:
        # Node 24 included: `node --test` rejects a directory argument on it
        # (test:node uses explicit file paths) — CI must catch such regressions.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bun install --frozen-lockfile
      - name: Build native addon (host)
        run: bun run build:debug
      - name: Build compiled ESM entry (dist)
        run: bun run build:js
      - name: Node smoke + enterprise tests
        run: node --test test/integration/node-smoke.test.mjs test/integration/node-enterprise.test.mjs
      - name: Validate npm tarball (dist + native binaries)
        run: npm pack --dry-run 2>&1 | grep -E "dist/index|\.node" | head -20
      - name: Installed-tarball end-to-end (import from node_modules)
        run: node scripts/verify-install.mjs

  # ── Multi-platform addon artifacts ───────────────────────────────
  # The target matrix + cross-build recipe live in build-addons.yml (shared
  # with release.yml). CI builds every target on each push/PR so a
  # cross-platform break surfaces before a tag.
  build:
    name: Build native addons
    needs: [rust]
    uses: ./.github/workflows/build-addons.yml
