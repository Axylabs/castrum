name: Release

# Canonical release: build every native target, publish the npm tarball with
# provenance, and attach the same binaries + checksums to a GitHub release.
#
# Trigger with a version tag (`git tag v0.9.11 && git push origin v0.9.11`) or
# manually from the Actions tab against an existing tag. The tag MUST match
# package.json / Cargo.toml / Cargo.lock (verified below).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.9.11)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: castrum
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  # ── Quality gate ────────────────────────────────────────────────
  verify:
    name: Verify version + tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Read the pinned Rust channel (rust-toolchain.toml)
        id: rust-channel
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Tag matches the package + crate version
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag '$tag' is not vX.Y.Z"; exit 1; }
          version="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "tag=$version package=$pkg cargo=$cargo"
          [[ "$version" == "$pkg" ]] || { echo "::error::tag $tag != package.json $pkg"; exit 1; }
          [[ "$version" == "$cargo" ]] || { echo "::error::tag $tag != Cargo.toml $cargo"; exit 1; }
      - run: bun install --frozen-lockfile
      # The JS suite loads the addon; GitHub Actions makes postinstall skip the
      # from-source fallback, so build the host addon explicitly (same step CI's
      # TypeScript job uses).
      - run: bun run build:debug
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --release
      # Same supply-chain gates as CI (transitively required by the old publish
      # job): advisories/licences in both lockfiles.
      - name: Dependency audit (Rust)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        env:
          RUSTC_WRAPPER: ""
      - run: bun run audit --audit-level=high
      - run: bun run typecheck
      - run: bun run typecheck:test
      - run: bun run lint:ci
      # Runs the same suite as `bun run test` plus the coverage floor, so the
      # release gate does not execute the tests twice.
      - run: bun run test:coverage
      - run: bun run check
      # Wire-format guard: validates the ingress response shape under load.
      - name: HTTP smoke (wire-format guard)
        run: bun run bench:http:smoke
        timeout-minutes: 8
      # Node compatibility + the installed-tarball path the old CI publish job
      # required: dist/ entry, single-platform `npm pack`, import from
      # node_modules under plain Node.
      - run: bun run build:js
      - run: node --test test/integration/node-smoke.test.mjs test/integration/node-enterprise.test.mjs
      - run: node scripts/verify-install.mjs
      - run: bun run check:version
      - run: bun run check:clean
      - run: bun run check:jsdoc

  # ── Native addons (all platforms) ───────────────────────────────
  build:
    name: Build native addons
    needs: [verify]
    uses: ./.github/workflows/build-addons.yml

  # ── npm publish (Trusted Publishing / OIDC, token fallback) ─────
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify, build]
    environment: NPM_TOKEN
    timeout-minutes: 15
    permissions:
      contents: read
      # npm Trusted Publishing exchanges this OIDC token for a short-lived
      # publish credential; attest-build-provenance needs it too.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      # No registry token is REQUIRED: npm prefers OIDC when configured and
      # falls back to the token below otherwise, so a release works either way.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.2)
        run: |
          npm install -g npm@latest
          node -e 'const v=require("node:child_process").execSync("npm --version").toString().trim().split(".").map(Number); const old=v[0]<11||(v[0]===11&&(v[1]<5||(v[1]===5&&v[2]<2))); if(old){console.error(`::error::npm ${v.join(".")} is too old for OIDC trusted publishing (need >= 11.5.2)`);process.exit(1)} console.log(`npm ${v.join(".")} supports trusted publishing`)'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Download all platform addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: addon-*
          merge-multiple: true
      - name: Generate SBOM (dependency inventory)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65cb221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: spdx-json
          artifact-name: castrum-sbom.spdx.json
      # Diagnostics for the OIDC path: if publishing fails, the log shows
      # whether the runner exposed an id-token and whether an .npmrc auth entry
      # (which makes npm prefer token auth) exists. The token is never printed.
      - name: Report the OIDC environment
        run: |
          echo "id-token request url   : ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "id-token request token : ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          echo "expected claim         : ${{ github.repository }} / .github/workflows/release.yml @ ${{ github.ref }}"
          if [ -f "$HOME/.npmrc" ]; then
            echo "~/.npmrc present (token fallback wired):"
            sed 's/_authToken=.*/_authToken=<redacted>/' "$HOME/.npmrc"
          else
            echo "no ~/.npmrc"
          fi
      # prepublishOnly rebuilds dist/ (build:js) and stages ./artifacts/*.node
      # into the package root, failing if any napi target is missing.
      #
      # NOTE: if the trusted publisher is configured for `npm stage publish`
      # only, npm STAGES this version instead of failing — the step exits 0 and
      # logs `+ castrum@<version>`, but nothing goes live until a maintainer
      # approves it with 2FA (`npm stage approve <stage-id>`). Verify releases
      # on the registry, never by this job's conclusion.
      - name: Publish to npm (OIDC trusted publishing, token fallback)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # SLSA3 provenance: records the repo/commit that produced this release so
      # consumers can verify the artifact's supply chain.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "${{ github.workspace }}/artifacts/*.node"

  # ── GitHub release (binaries + checksums) ──────────────────────
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [publish]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Download all platform addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: addon-*
          merge-multiple: true
      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*.node > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.node artifacts/SHA256SUMS --clobber
          else
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --generate-notes \
              artifacts/*.node artifacts/SHA256SUMS
          fi
