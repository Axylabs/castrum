# Qlty configuration for castrum.
#
# qlty is the long-term code-quality umbrella: a consistent, git-aware layer
# (lint + secrets + GitHub Actions hardening) over the repo's own biome +
# cargo/clippy + test gates.
#
# Managed locally:  `qlty plugins update && qlty install`
# Run everything:   `qlty check`   |   staged-only hook: `qlty check`
# Docs: https://qlty.sh/d/config
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/coverage/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # Compiled JS dist + native addon build output.
  "dist/**",
  "*.node",
  "rust/target/**",
  "bench/results/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# ── Linters ─────────────────────────────────────────────────────────────────
# oxc (oxlint) runs alongside the repo's biome gate; qlty manages its own
# pinned copy so the whole team shares one version.
[[plugin]]
name = "oxc"

# ── Security & CI hygiene ──────────────────────────────────────────────────
[[plugin]]
name = "actionlint"

[[plugin]]
name = "zizmor"

[[plugin]]
name = "trufflehog"
