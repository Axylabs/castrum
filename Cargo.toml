[package]
name = "rust_bench"
version = "1.0.0"
edition = "2021"

[lib]
name = "rust_bench"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5.8"

ring = "0.17"
base64 = "0.22"

crc32fast = "1"
form_urlencoded = "1"
httparse = "1"
cookie = "0.18"
email_address = "0.2"
json-patch = "4"
mime_guess = "2"
getrandom = "0.4.3"
rayon = "1.12.0"
mimalloc = "0.1.52"
memchr = "2.8.3"
simdutf8 = "0.1.5"
jsonschema = "0.48.5"
core_affinity = "0.8.3"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
debug-assertions = false
# Optional, only if you are confident there are no panics:
# panic = "abort"