[package]
name = "rust_bench"
version = "0.5.0"
edition = "2021"

[lib]
name = "rust_bench"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5.8"
sha2 = "0.10"
sha1 = "0.11"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
crc32fast = "1"
fnv = "1"
percent-encoding = "2"
form_urlencoded = "1"
httparse = "1"
cookie = "0.18"
matchit = "0.9.2"
email_address = "0.2"
uuid = { version = "1", features = ["v4"] }
json-patch = "4"
mime_guess = "2"
getrandom = "0.4.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
