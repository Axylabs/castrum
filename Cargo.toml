[package]
name = "rust_bench"
# Keep in sync with package.json "version" (single source of truth: the npm package).
version = "0.6.0"
edition = "2021"

[lib]
name = "rust_bench"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
napi = { version = "3", features = ["napi10"] }
napi-derive = "3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"

# default-features=false: drop resolve-http + tls-aws-lc-rs which pull in
# reqwest -> hyper/h2/tokio/rustls (large binary, attack surface). Format
# validators (email etc.) are built-in and NOT feature-gated in 0.48.
jsonschema = { version = "0.48", default-features = false, features = ["resolve-file"] }
json-patch = "4"
aws-lc-rs = "1"
base64 = "0.23"
crc32fast = "1"
httparse = "1"
mime_guess = "2"
phf = { version = "0.14", features = ["macros"] }
getrandom = "0.4"
memchr = "2"
simdutf8 = "0.1"
email_address = "0.2"
fast_chemail = { version = "0.9", optional = true }
rayon = "1"
# mimalloc is set as the Rust #[global_allocator] (see rust/lib.rs). We DELIBERATELY
# do NOT enable the "override" feature: it interposes libc malloc/free at the
# process level, which is an embedding hazard when this cdylib is dlopen'd into
# Bun (which itself embeds mimalloc -> symbol clashes). The Rust-level global
# allocator keeps most of the allocation win without replacing the host malloc.
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }
core_affinity = "0.8"

parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ipnet = "2"
lru = "0.12"

[build-dependencies]
napi-build = "2"

[features]
default = ["fast-email"]
fast-email = ["dep:fast_chemail"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false
# Safety: this is an embedded cdylib loaded into the Bun process. panic = "unwind"
# (the default) lets napi's catch_unwind convert Rust panics into JS exceptions
# instead of aborting the host process. overflow-checks = true catches integer
# overflow in release; the cost is negligible relative to the safety gain.
overflow-checks = true
debug-assertions = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1