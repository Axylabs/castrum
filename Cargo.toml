[package]
name = "rust_bench"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# High-performance JSON parsing/serialization.
# If this causes issues on a target, fallback to serde_json.
sonic-rs = "0.5.8"

# Crypto / hashing
sha2 = "0.10"
sha1 = "0.11.0"
hmac = "0.12"
hex = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
base64 = "0.22"
crc32fast = "1"
fnv = "1"

# URLs / query / encoding
url = "2"
percent-encoding = "2"
form_urlencoded = "1"

# HTTP
httparse = "1"
http = "1"
cookie = "0.18"

# Routing
matchit = "0.9.2"

# Validation
email_address = "0.2"
ipnet = "2"
uuid = { version = "1", features = ["v4"] }

# JSON Patch
json-patch = "4"

# JWT
jsonwebtoken = "10.4.0"

# MIME
mime = "0.3"
mime_guess = "2"

# Random
rand = "0.10.2"
getrandom = "0.4.3"

# Compression
flate2 = { version = "1", features = ["zlib-ng"] }
zstd = "0.13"
brotli = "8.0.4"

# Search / text
aho-corasick = "1"
memchr = "2"
regex = "1"

# Time
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"