[package]
name = "rust_bench"
version = "1.0.0"
edition = "2021"

[lib]
name = "rust_bench"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
# ------------------------------------------------------------------
# Node-API / Tokio runtime
# ------------------------------------------------------------------
# Use the current napi-rs major and enable Tokio-backed async functions.
# If napi v3 is not available for your target yet, see fallback below.
napi = { version = "3", features = ["napi10", "tokio_rt", "serde-json"] }
napi-derive = "3"

# Used directly by async spawn_blocking helpers.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# ------------------------------------------------------------------
# JSON
# ------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }

# Keep serde_json only where jsonschema / json-patch interop requires it.
serde_json = "1"

# Fast JSON parsing/validation.
sonic-rs = "0.5"

# JSON Schema validation.
jsonschema = "0.48"

# JSON Patch.
json-patch = "4"

# ------------------------------------------------------------------
# Crypto / hashing
# ------------------------------------------------------------------
# Modern replacement for ring.
aws-lc-rs = "1"

base64 = "0.23"
crc32fast = "1"

# ------------------------------------------------------------------
# Parsing / validation / encoding
# ------------------------------------------------------------------
httparse = "1"
mime_guess = "2"
phf = { version = "0.14", features = ["macros"] }
getrandom = "0.4"
memchr = "2"
simdutf8 = "0.1"
form_urlencoded = "1"

# Email validation fallback.
email_address = "0.2"

# Optional faster email validation.
fast_chemail = { version = "0.9", optional = true }

# ------------------------------------------------------------------
# Parallelism / allocator / affinity
# ------------------------------------------------------------------
rayon = "1"
mimalloc = { version = "0.1", features = ["override"] }
core_affinity = "0.8"

[build-dependencies]
napi-build = "2"

[features]
default = ["fast-email"]
fast-email = ["dep:fast_chemail"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false
overflow-checks = false
debug-assertions = false

# Required for Tokio async panic containment.
# Do not use panic = "abort" unless you have proven no Rust panic paths.
panic = "unwind"