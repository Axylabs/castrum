[package]
name = "castrum"
# Keep in sync with package.json "version" (single source of truth: the npm package).
version = "0.9.4"
edition = "2021"

[lib]
name = "castrum"
crate-type = ["cdylib", "rlib"]
path = "rust/lib.rs"

# Native-only benchmark binary: times the pure-Rust cores (crc32, hashing,
# hex/base64/url, validators, packed parsers, gzip/brotli, ...) with NO JS / FFI
# boundary, so bench/ffi-margin.ts can compare them against the same ops called
# through bun:ffi and pinpoint exactly where the crossing cost is. Diagnostic
# only — never shipped; NOT part of the addon surface.
[[bin]]
name = "native-bench"
path = "rust/src/bin/native-bench.rs"

[dependencies]
napi = { version = "3", features = ["napi10", "serde-json"] }
napi-derive = "3"

serde = { version = "1", features = ["derive"] }
# preserve_order: IndexMap for serde_json::Value objects -> faster DOM build + O(1)
# object lookups during jsonschema validation (BTreeMap default is O(log n)).
# Key order becomes insertion order; correctness checks are order-insensitive.
serde_json = { version = "1", features = ["preserve_order"] }
# sort_keys: sonic's owned `Value` object backs mutable objects with
# AHashMap (non-deterministic iteration order) unless `sort_keys` is enabled,
# which swaps the owned map to BTreeMap → DETERMINISTIC sorted serialization.
# Determinism is a hard wire-format requirement: JWT sign (iat/exp injection)
# and the RFC 6902 patch engine must emit byte-identical output across the
# FFI/napi/scalar/bulk transports. Parsed (unmutated) values keep the shared
# Vec representation (insertion order) — only mutation switches to the map.
sonic-rs = { version = "0.5", features = ["sort_keys"] }

# default-features=false: drop resolve-http + tls-aws-lc-rs which pull in
# reqwest -> hyper/h2/tokio/rustls (large binary, attack surface). Format
# validators (email etc.) are built-in and NOT feature-gated in 0.48.
jsonschema = { version = "0.49", default-features = false, features = ["resolve-file"] }
aws-lc-rs = "1"
# NOTE: base64 0.23 enables SIMD (SSE/AVX) by default via the `simd-unsafe`
# feature (part of `default`); no explicit feature is needed.
base64 = "0.23"
crc32fast = "1"
httparse = "1"
mime_guess = "2"
phf = { version = "0.14", features = ["macros"] }
getrandom = "0.4"
memchr = "2"
simdutf8 = "0.1"
email_address = "0.2"
fast_chemail = { version = "0.9", optional = true }
# Replicate jsonschema 0.48.5's format:"email" hostname validation (punycode
# A-labels + RFC 5892 PVALID/contextual rules) on the zero-DOM fast path. Same
# crates/versions the jsonschema crate uses, so the fast path stays byte-parity.
idna = "1"
unicode-general-category = "1"
rayon = "1"
# mimalloc is set as the Rust #[global_allocator] (see rust/lib.rs). We DELIBERATELY
# do NOT enable the "override" feature: it interposes libc malloc/free at the
# process level, which is an embedding hazard when this cdylib is dlopen'd into
# Bun (which itself embeds mimalloc -> symbol clashes). The Rust-level global
# allocator keeps most of the allocation win without replacing the host malloc.
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }
core_affinity = "0.8"

parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ipnet = "2"
lru = "0.16"
# Zero-cost hashing for fast_schema object-key lookups (default SipHash is slow
# on short keys). Already a transitive dep, so no new download.
rustc-hash = "2"
# fast_schema extended-keyword parity: fancy-regex is the SAME regex engine the
# jsonschema crate uses for `pattern`/`patternProperties` (ECMA-262 semantics incl.
# lookahead/backrefs); fraction::BigFraction is the SAME exact-rational type used
# for `multipleOf` divisibility. Both are already transitive deps, so no new
# downloads — but they become direct deps so fast_schema can use them.
fancy-regex = "0.19"
fraction = "0.15"
# Exact cross-type number equality for enum/const/uniqueItems (same semantics
# jsonschema uses via jsonschema-value's cmp::equal). Already transitive.
num-cmp = "0.1"

# Backend-framework feature additions (Phase A/B/C)
# argon2id password hashing (password-hash/rand features are default-on).
argon2 = "0.5"
# bcrypt password hashing (pure-Rust, Blowfish-based).
bcrypt = "0.19"
# PBKDF2-HMAC-SHA256 (RustCrypto) — pure-Rust KDF.
pbkdf2 = "0.12"
sha2 = "0.11"
# HTML templating (fast, safe, no eval).
minijinja = "2"
# gzip via the memory-safe zlib-rs backend (pure Rust, no C).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# brotli compression (pure Rust port).
brotli = "8"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# Property-based testing for the security-sensitive wire parsers (fuzz-style
# with automatic shrinking) — complements the deterministic xorshift corpus in
# rust/test_support.rs. Runs under `cargo test`; not part of the shipped addon.
proptest = "1"

[features]
default = ["fast-email"]
fast-email = ["dep:fast_chemail"]

# Codify the CI clippy gate (`cargo clippy --all-targets -- -D warnings`) so a
# bare local `cargo clippy` fails on the same lints — no flag drift between
# laptop and CI. Clippy-only lints: normal `cargo build`/`test` are unaffected.
[lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false
# Safety: this is an embedded cdylib loaded into the Bun process. panic = "unwind"
# (the default) lets napi's catch_unwind convert Rust panics into JS exceptions
# instead of aborting the host process. overflow-checks = true catches integer
# overflow in release; the cost is negligible relative to the safety gain.
overflow-checks = true
debug-assertions = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1